<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./favicon.svg">
    <link rel="stylesheet" href="./CSS/general.css">
    <title>Menú de la documentació</title>

    <!-- Referéncia al script de navegació, carrega després que la página. -->
    <script src="./JS/navegacio.js" defer></script>

    <!-- Executa la funció corresponent del script de navegació de pàgines. -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            navegacioMenu();
        });
    </script>
</head>
<style>
    main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 25px;
    }

    main div {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border: 1px solid black;
        border-radius: 5px;
        width: 300px;
        padding: 10px;
        transition: width 0.2s, transform 0.2s, box-shadow 0.2s;
    }
    main div:hover {
        width: 350px;
        cursor: pointer;
        box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
    }
    main div:active {
        transform: scale(0.9);
    }
    h2 {
        font-size: clamp(1rem, 125%, 2rem);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex-grow: 1;
        text-align: left;
    }
</style>

<!-- Executa la funció corresponent del script de navegació de pàgines. -->
<body>
    <header>
        
    </header>
    <h1>Menú de la documentació</h1>
    <main>
        <div id="base_dades">
            <h2>Base de dades</h2>
            <img src="./Imatges/Menú/Logo1.png" alt="Logo base de dades">
        </div>
        <div id="uml">
            <h2>UML</h2>
            <img src="./Imatges/Menú/Logo2.png" alt="Logo UML">
        </div>
        <div id="manual">
            <h2>Manual d'ús de l'aplicació</h2>
            <img src="./Imatges/Menú/Logo3.png" alt="Logo manual">
        </div>
        <div id="problemes_solucions">
            <h2>Problemes i solucions</h2>
            <img src="./Imatges/Menú/Logo4.png" alt="Logo troubleshoot">
        </div>
    </main>
</body>
</html>
